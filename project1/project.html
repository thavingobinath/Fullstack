<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>E-commerce Shopping Cart</title>
  <link rel="stylesheet" href="project.css" />
</head>
<body>

  <header>
    <h1 style="margin-left: 50px;">🛒 E-Commerce Store</h1>
    <div class="cart-info">
      Cart Items:<span id="cart-count">0</span> |
      Total: $<span id="cart-total">0</span>
    </div>
  </header>

  <section class="filter">
    <label>Max Price: $<span id="price-value">1000</span></label>
    <input type="range" id="price-slider" min="0" max="1000" value="1000" />
  </section>

  <main>
    <div id="product-grid" class="product-grid"></div>
  </main>

  <script src="project.js"></script>
</body>
</html>
